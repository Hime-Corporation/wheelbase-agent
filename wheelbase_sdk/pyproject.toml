[project]
name = "wheelbase_sdk"
version = "0.1.0"
description = "Shared client for Wheelbase Hermes plugins — Supabase PostgREST + Go API, authed via the per-request session token."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wheelbase_sdk*"]
